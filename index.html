<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألف جملة إنجليزية</title>
<style>
:root{--bg:#f3eee4;--card:#fbf8f1;--tx:#2a2926;--mu:#7a756b;--ac:#2f7f79;--onac:#fff;--ac2:#e3efe9;--bd:#e4dccd;--ok:#3d8b5a;--warn:#b9791f;--bad:#c4513f;--sh:0 6px 24px rgba(60,45,20,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--card:#1d2528;--tx:#e8e5de;--mu:#99a1a2;--ac:#5cc2b8;--onac:#0d1f1d;--ac2:#1b3330;--bd:#2c373a;--ok:#6fcf93;--warn:#e0b25a;--bad:#ef8a78;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191b;--card:#1d2528;--tx:#e8e5de;--mu:#99a1a2;--ac:#5cc2b8;--onac:#0d1f1d;--ac2:#1b3330;--bd:#2c373a;--ok:#6fcf93;--warn:#e0b25a;--bad:#ef8a78;--sh:none;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;font-size:16px}
button{font:inherit;color:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#hd{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;max-width:560px;margin:0 auto;min-height:56px}
#hd h1{font-size:1.15rem;margin:0;font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:1.3rem;cursor:pointer}
.ib:active{background:var(--ac2)}
#app{max-width:560px;margin:0 auto;padding:4px 16px calc(96px + env(safe-area-inset-bottom,0px))}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{border:0;background:transparent;padding:8px 0 7px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.78rem;position:relative}
#nav button i{font-style:normal;font-size:1.35rem;line-height:1.3}
#nav button.on{color:var(--ac);font-weight:700}
#nav b{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;line-height:18px;text-align:center;padding:0 4px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:14px 16px;font-size:1rem;cursor:pointer;min-height:52px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:700}
.btn.ok{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
.btn.wide{width:100%}
.hero{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--sh);margin:6px 0 14px;text-align:center}
.big{font-size:2.6rem;font-weight:700;line-height:1.2;color:var(--ac)}
.big small{font-size:1.1rem;color:var(--mu);font-weight:400}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .3s}
input[type=search]{width:100%;padding:13px 16px;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:14px;outline:none}
input[type=search]:focus{border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px 12px;text-align:center;cursor:pointer;box-shadow:var(--sh);border-inline:1px solid var(--bd)}
.tile:active{transform:scale(.97)}
.tile .e{font-size:2rem;line-height:1.3}
.tile .t{font-weight:700;font-size:.95rem;margin-top:2px}
.tile .n{color:var(--mu);font-size:.78rem}
.tile .bar{height:5px;margin:8px 0 0}
.row{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row .en{direction:ltr;text-align:left;font-weight:600}
.row .ar{color:var(--mu);font-size:.92rem}
.cnt{text-align:center;color:var(--mu);font-size:.95rem;margin:2px 0 10px}
.cardbig{background:var(--card);border-radius:28px;padding:26px 20px;box-shadow:var(--sh);text-align:center;min-height:270px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;border:1px solid var(--bd)}
.cardbig.sv{border-color:var(--ac)}
.cardbig .ce{font-size:2.6rem;line-height:1.2}
.en{direction:ltr}
.cardbig .en{font-size:1.75rem;font-weight:600;line-height:1.35;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.pr{color:var(--ac);font-size:1.15rem;font-weight:600}
.cardbig .ar{color:var(--mu);font-size:1.2rem;margin-top:6px}
.blur{filter:blur(9px);user-select:none}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 10px}
.tools button{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--mu);cursor:pointer;min-height:62px}
.tools button i{font-style:normal;font-size:1.4rem;line-height:1.3}
.tools button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
.tools button:active{transform:scale(.95)}
.n3{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px}
.rs{display:flex;align-items:baseline;gap:10px;justify-content:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;margin-top:12px}
.rs b{font-size:1.5rem}.rs.g b,.rs.g span{color:var(--ok)}.rs.m b,.rs.m span{color:var(--warn)}.rs.b b,.rs.b span{color:var(--bad)}
.rs small{width:100%;text-align:center;color:var(--mu);direction:ltr;font-size:.85rem}
.em{text-align:center;color:var(--mu);padding:40px 0;font-size:1.1rem}
.em .ee{font-size:3rem}
.st{text-align:center;color:var(--mu);margin:0 0 8px}
.bub{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 14px;margin:8px 0;max-width:92%;cursor:pointer}
.bub.a{margin-inline-end:auto}
.bub.b{margin-inline-start:auto;background:var(--ac2);border-color:transparent}
.bub .w{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--ac);color:var(--onac);font-size:.8rem;margin-inline-end:6px}
.bub .en{font-size:1.1rem;font-weight:600;font-family:"Segoe UI",system-ui,Arial,sans-serif}
.bub .ar{color:var(--mu);font-size:.95rem}
.bub.pl{outline:2px solid var(--ac)}
.bub .fb{font-size:.9rem;margin-top:4px}
.bub.q .en{display:none}.bub.q .ar{color:var(--tx);font-weight:700;font-size:1.05rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
#ts{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:14px;font-size:.9rem;z-index:9;max-width:90%;text-align:center;display:none}
.cr{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 14px}
.cr .e{font-size:1.5rem}.cr .m{flex:1}.cr .bar{margin:4px 0 0;height:6px}
.cr .n{color:var(--mu);font-size:.8rem;min-width:56px;text-align:left;direction:ltr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kp{background:var(--card);border-radius:20px;padding:14px;text-align:center;border:1px solid var(--bd)}
.kp b{display:block;font-size:1.8rem;color:var(--ac)}.kp span{color:var(--mu);font-size:.85rem}
</style>
</head>

<script>
const DATA={"C":[["👋","تحيات"],["🤝","تعارف"],["💭","مشاعر وآراء"],["🙏","طلبات ومجاملات"],["✈️","سفر"],["🍽️","مطعم"],["🛍️","تسوق"],["💼","عمل"],["🚑","صحة وطوارئ"],["☕","محادثة"],["🏠","البيت"],["👨‍👩‍👧","العائلة والأصدقاء"],["🕐","الوقت والمواعيد"],["🌦️","الطقس"],["🚗","مواصلات وطرق"],["🏨","فندق وإقامة"],["🛂","مطار وجوازات"],["🗺️","اتجاهات"],["🛒","سوبرماركت وبقالة"],["🏦","بنك ومال"],["🎓","دراسة ومدرسة"],["💻","تقنية وإنترنت"],["📞","مكالمات هاتفية"],["🏋️","رياضة ولياقة"],["👕","ملابس ومظهر"],["🎉","مناسبات وهدايا"],["🎬","هوايات وترفيه"]],"L":[[0,"Good morning! How are you today?","صباح الخير! كيف حالك اليوم؟","جود مورنينج! هاو آر يو توداي؟"],[0,"I’m fine, thank you. And you?","أنا بخير، شكرًا. وأنت؟","آيم فاين، ثانك يو. آند يو؟"],[0,"Nice to meet you.","تشرفت بمعرفتك.","نايس تو ميت يو."],[0,"Long time no see!","مرّ وقت طويل منذ آخر مرة رأيتك!","لونج تايم نو سي!"],[0,"See you later.","أراك لاحقًا.","سي يو لايتر."],[0,"Take care!","اعتنِ بنفسك!","تيك كير!"],[0,"Have a nice day.","أتمنى لك يومًا سعيدًا.","هاف أ نايس داي."],[0,"Welcome! Please come in.","أهلًا بك! تفضّل بالدخول.","ويلكم! بليز كام إن."],[1,"What’s your name?","ما اسمك؟","واتس يور نيم؟"],[1,"My name is Ahmed.","اسمي أحمد.","ماي نيم إز أحمد."],[1,"Where are you from?","من أين أنت؟","وير آر يو فروم؟"],[1,"How old are you?","كم عمرك؟","هاو أولد آر يو؟"],[1,"Do you speak English?","هل تتحدث الإنجليزية؟","دو يو سبيك إنجلش؟"],[1,"I’m learning English.","أنا أتعلم الإنجليزية.","آيم ليرنينج إنجلش."],[1,"Could you speak more slowly?","هل يمكنك التحدث ببطء أكثر؟","كُود يو سبيك مور سلولي؟"],[1,"Could you repeat that, please?","هل يمكنك أن تعيد ذلك من فضلك؟","كُود يو ريبيت ذات، بليز؟"],[1,"I don’t understand.","لا أفهم.","آي دونت أندرستاند."],[1,"What does this word mean?","ماذا تعني هذه الكلمة؟","وات داز ذيس وورد مين؟"],[2,"I’m really tired today.","أنا متعب جدًا اليوم.","آيم ريلي تايرد توداي."],[2,"I’m so happy for you!","أنا سعيد جدًا من أجلك!","آيم سو هابي فور يو!"],[2,"I think you’re right.","أظن أنك محق.","آي ثينك يور رايت."],[2,"I don’t agree with you.","لا أتفق معك.","آي دونت أجري ويذ يو."],[2,"That sounds great!","يبدو ذلك رائعًا!","ذات ساوندز جريت!"],[2,"I’m not sure yet.","لست متأكدًا بعد.","آيم نوت شور ييت."],[2,"It depends.","الأمر يعتمد.","إت ديبيندز."],[2,"I’ll think about it.","سأفكر في الأمر.","آيل ثينك أباوت إت."],[2,"Never mind.","لا يهم.","نيفر مايند."],[2,"I’m looking forward to it.","أتطلع إلى ذلك بشوق.","آيم لوكينج فورورد تو إت."],[3,"Can you help me, please?","هل يمكنك مساعدتي من فضلك؟","كان يو هيلب مي، بليز؟"],[3,"Could I ask you a question?","هل يمكنني أن أسألك سؤالًا؟","كُود آي آسك يو أ كويشن؟"],[3,"Thank you so much.","شكرًا جزيلًا.","ثانك يو سو ماتش."],[3,"You’re welcome.","على الرحب والسعة.","يور ويلكم."],[3,"I’m sorry for being late.","آسف على التأخر.","آيم سوري فور بيينج ليت."],[3,"Excuse me, where is the restroom?","عفوًا، أين دورة المياه؟","إكسكيوز مي، وير إز ذا ريستروم؟"],[3,"Do you mind if I sit here?","هل تمانع إن جلست هنا؟","دو يو مايند إف آي سيت هير؟"],[3,"No problem at all.","لا مشكلة إطلاقًا.","نو بروبلم آت أول."],[3,"Just a moment, please.","لحظة من فضلك.","جاست أ مومنت، بليز."],[3,"Let me know if you need anything.","أخبرني إن احتجت أي شيء.","ليت مي نو إف يو نيد إنيثينج."],[4,"Where is the nearest station?","أين أقرب محطة؟","وير إز ذا نيرست ستيشن؟"],[4,"How do I get to the airport?","كيف أصل إلى المطار؟","هاو دو آي جيت تو ذي إيربورت؟"],[4,"How much is a ticket to the city center?","كم سعر التذكرة إلى وسط المدينة؟","هاو ماتش إز أ تيكت تو ذا سيتي سنتر؟"],[4,"Does this bus go downtown?","هل يذهب هذا الباص إلى وسط البلد؟","داز ذيس باس جو داون تاون؟"],[4,"I’d like to book a room for two nights.","أود حجز غرفة لليلتين.","آيد لايك تو بوك أ روم فور تو نايتس."],[4,"What time is check-out?","متى موعد المغادرة من الفندق؟","وات تايم إز تشيك آوت؟"],[4,"I have a reservation under the name Ahmed.","لدي حجز باسم أحمد.","آي هاف أ ريزرفيشن أندر ذا نيم أحمد."],[4,"My flight has been delayed.","تأخرت رحلتي.","ماي فلايت هاز بين ديليد."],[4,"Can you take a photo of us <div class="cardbig" id="rc" style="cursor:default"><div class="ce">${C[x[0]][0]}</div><div class="ar" style="color:var(--tx);font-size:1.5rem;font-weight:700;margin:0">${x[2]}</div>${rr?`<div class="en" style="margin-top:10px">${x[1]}</div><div class="pr">${x[3]}</div>`:""}</div>
<div style="height:14px"></div>`+(rr?`<div class="n3" style="grid-template-columns:1fr 1fr 1fr"><button class="btn" data-v="no">❌ نسيتها</button><button class="btn" data-v="say">🔊</button><button class="btn p" data-v="yes">✅ تذكرتها</button></div>`:`<button class="btn p wide" data-v="show">👁 أظهر</button>`);
}
app.addEventListener("click",e=>{
if(tab!=="rev")return;const b=e.target.closest("[data-v]");if(!b)return;const v=b.dataset.v,i=rq[0];
if(v==="show"){rr=true;viewRev();speak(L[i][1])}
else if(v==="say"){halt();speak(L[i][1])}
else if(v==="yes"){halt();if(retry.has(i)){retry.delete(i)}else{const r=R[i];r.s++;r.n=r.s>=6?null:day()+INT[r.s]}rq.shift();rdone++;touch();sv();rr=false;drawNav();viewRev()}
else if(v==="no"){halt();R[i]={s:0,n:day()+1};retry.add(i);rq.shift();rq.push(i);touch();sv();rr=false;drawNav();viewRev()}
});

/* ===== محادثات ===== */
function viewDlgList(){
title("محادثات");
app.innerHTML=`<div class="grid">${C.map((c,k)=>`<div class="tile" data-d="${k}"><div class="e">${c[0]}</div><div class="t">${c[1]}</div></div>`).join("")}</div>`}
app.addEventListener("click",e=>{
if(tab!=="dlg"||sub)return;const t=e.target.closest("[data-d]");if(!t)return;
dk=+t.dataset.d;dTest=false;dRole=-1;sub="dlg";render();scrollTo(0,0)});
function viewDlg(){
title(C[dk][1]);const d=D[dk];
app.innerHTML=`<div class="tools" style="grid-template-columns:repeat(4,1fr)"><button data-m="play" class="${dOn&&dRole<0?"on":""}"><i>${dOn&&dRole<0?"⏹":"▶"}</i>استمع</button><button data-m="r0"><i>🎤</i>دور أ</button><button data-m="r1"><i>🎤</i>دور ب</button><button data-m="test" class="${dTest?"on":""}"><i>🎧</i>اختبار</button></div><div id="bl">${d.map((x,k)=>`<div class="bub ${k%2?"b":"a"} ${dRole>=0&&k%2===dRole?"q":""}" data-k="${k}"><span class="w">${k%2?"ب":"أ"}</span><div class="en${dTest?" blur":""}">${x[0]}</div><div class="ar${dTest?" blur":""}">${x[1]}</div><div class="fb"></div></div>`).join("")}</div>`}
const bub=k=>document.querySelectorAll("#bl .bub")[k];
function mark(k){document.querySelectorAll("#bl .bub").forEach((el,i)=>el.classList.toggle("pl",i===k))}
app.addEventListener("click",e=>{
if(tab!=="dlg"||sub!=="dlg")return;
const m=e.target.closest("[data-m]"),b=e.target.closest(".bub");
const d=D[dk];
if(m){const v=m.dataset.m;
if(v==="play"){if(dOn){halt();viewDlg();return}halt();dRole=-1;dOn=true;const id=++run;viewDlg();let k=0;const nx=()=>{if(id!==run)return;if(k>=d.length){dOn=false;mark(-1);viewDlg();return}const i=k++;mark(i);speak(d[i][0],{v:i%2},()=>setTimeout(nx,450))};nx()}
else if(v==="test"){halt();dTest=!dTest;dRole=-1;viewDlg()}
else{rolePlay(+v[1])}
return}
if(b){const k=+b.dataset.k;halt();
if(dTest&&dRole<0){const fb=b.querySelector(".fb");fb.textContent="🔊";const id=++run;
speak(d[k][0],{v:k%2},()=>{if(id!==run)return;setTimeout(()=>{if(id!==run)return;fb.textContent="🎤";listen(d[k][1],s=>{if(id!==run)return;b.querySelectorAll(".blur").forEach(z=>z.classList.remove("blur"));fb.innerHTML=rsHtml(s,true)},true)},300)})}
else speak(d[k][0],{v:k%2})}
});
function rolePlay(role){
if(!SR){toast("التعرف على الصوت غير مدعوم هنا. جرّب كروم أو سفاري");return}
halt();dTest=false;dRole=role;dOn=true;const id=++run;viewDlg();
const d=D[dk];let k=0,tot=0,n=0;
const nx=()=>{if(id!==run)return;
if(k>=d.length){dOn=false;mark(-1);const f=bub(d.length-1);if(f)f.insertAdjacentHTML("afterend",`<div class="rs ${n&&tot/n>=85?"g":tot/n>=60?"m":"b"}"><b>${n?Math.round(tot/n):0}%</b></div>`);return}
const i=k++,el=bub(i);mark(i);
if(i%2===role){const fb=el.querySelector(".fb");fb.textContent="🎤";
listen(d[i][0],s=>{if(id!==run)return;n++;tot+=s?s.p:0;el.classList.remove("q");fb.innerHTML=rsHtml(s);setTimeout(nx,1200)})}
else speak(d[i][0],{v:i%2},()=>setTimeout(nx,400))};
nx()}

/* ===== تقدّمي ===== */
function viewProg(){
title("تقدّمي");
const n=done.size,s=streak(),d=due().length;
const ms=Object.keys(R).filter(k=>R[k].s>=6).length;
app.innerHTML=`<div class="hero"><div class="big">${Math.round(n/N*100)}%</div><div class="bar"><i style="width:${n/N*100}%"></i></div></div>
<div class="two" style="margin-bottom:14px"><div class="kp"><b>${n}</b><span>✓ محفوظة</span></div><div class="kp"><b>${s}</b><span>🔥 أيام</span></div><div class="kp"><b>${N-n}</b><span>⏳ متبقية</span></div><div class="kp"><b>${ms}</b><span>🏆 متقنة</span></div></div>
${C.map((c,k)=>{const a=catIdx(k),m=a.filter(i=>done.has(i)).length;return `<div class="cr" data-p="${k}"><span class="e">${c[0]}</span><div class="m"><div>${c[1]}</div><div class="bar"><i style="width:${m/a.length*100}%"></i></div></div><span class="n">${m} / ${a.length}</span></div>`}).join("")}
<div style="height:8px"></div><button class="btn wide" data-p="ics">🔔 تذكير يومي</button>`}
app.addEventListener("click",e=>{
if(tab!=="prog")return;const b=e.target.closest("[data-p]");if(!b)return;
if(b.dataset.p==="ics"){ics();return}
const k=+b.dataset.p;tab="home";deck=catIdx(k);pos=firstTodo(deck);openCard()});
function ics(){const p=n=>String(n).padStart(2,"0"),d=new Date(),ds=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate()),TT="مراجعة الجمل الإنجليزية";
const t=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//k1000//AR","BEGIN:VEVENT","UID:k1000-rev@local","DTSTAMP:"+ds+"T000000Z","DTSTART:"+ds+"T200000","DTEND:"+ds+"T203000","RRULE:FREQ=DAILY","SUMMARY:"+TT,"BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:"+TT,"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));a.download="reminder.ics";document.body.appendChild(a);a.click();a.remove()}

sync();startRev();render();
</script>
</body>
